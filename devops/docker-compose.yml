services:
  library-backend:
    build:
      context: ..
      dockerfile: devops/Dockerfile

    container_name: library-backend

    ports:
      - "4000:4000"

    volumes:
      - ../public/uploads:/app/public/uploads
    
    restart: unless-stopped

    env_file:
      - ../.env

    networks:
      - postgres

networks:
  postgres:
    external: true